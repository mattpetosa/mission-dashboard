server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mission.mhpserver.cc;

    ssl_certificate     /etc/letsencrypt/live/mhpserver.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhpserver.cc/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Keep this host out of search engines (see the snippet for the
    # already-indexed caveat). The matching X-Robots-Tag header is
    # included per-location below.
    include /etc/nginx/snippets/robots-noindex.conf;

    root /var/www/mission.mhpserver.cc;
    index index.html;

    # Hand-edited front end: without an explicit header Cloudflare applies its
    # own per-extension TTL and serves a stale app.js/style.css for hours after
    # an edit (this bit plex.mhpserver.cc once).
    location / {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # No add_header Cache-Control here on purpose: the backend sets its own
    # per-route policy (no-store for /api/data, a long max-age for the proxied
    # imagery under /api/img, which is immutable per URL).
    location /api/ {
        include /etc/nginx/snippets/noindex.conf;
        proxy_pass http://127.0.0.1:8793/api/;
        proxy_set_header Host $host;
        # Both headers set explicitly: the realip module (wired globally in
        # nginx.conf) has already made $remote_addr the real, spoof-resistant
        # visitor IP, and overwriting both means either convention is safe.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold image-proxy miss has to fetch from the upstream CDN first.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
